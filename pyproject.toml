[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "fbnnet-core"
version = "1.1.3"
description = "Fundamental Boolean Network (FBN) inference of gene regulatory networks from time series, with a C++ core"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Leshi Chen", email = "chenleshi@hotmail.com"}]
keywords = ["boolean network", "gene regulatory network", "systems biology", "bioinformatics", "pybind11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# scipy is imported by the C++ extension for compute_fisher_test.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "networkx>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# pyreadr/rdata read the R datasets in data/ (tests and examples only).
test = ["pytest>=7", "pyreadr>=0.5", "rdata>=0.11"]

[project.urls]
Homepage = "https://github.com/clsdavid/fbnnet_core"
"Bug Tracker" = "https://github.com/clsdavid/fbnnet_core/issues"
"Original R package" = "https://github.com/clsdavid/FBNNet2_public"

[tool.setuptools]
packages = ["fbnnet_core"]

[tool.setuptools.package-data]
fbnnet_core = ["datasets/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686"
test-extras = ["test"]
test-command = "pytest {project}/tests -q"
