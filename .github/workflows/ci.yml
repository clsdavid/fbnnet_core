name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      # Run from a neutral directory so the installed wheel, not the source tree, is imported.
      - run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
        shell: bash
        working-directory: ${{ runner.temp }}
      # The spawn start method is the only one on Windows ; exercise it here too.
      - run: python -m pytest "$GITHUB_WORKSPACE/tests/test_parallel_backends.py" -q
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          FBNNET_START_METHOD: spawn

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  windows-wheel:
    # Dry run of the release build: the same cibuildwheel step as publish.yml, for one Python version.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_ARCHS: AMD64
          CIBW_BUILD: cp312-*
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-cp312
          path: wheelhouse/*.whl
          if-no-files-found: error
